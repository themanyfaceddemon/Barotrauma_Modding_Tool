name: Normalize .loc files

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code (for .loc files)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          path: pr_code
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: master
          path: main_code

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run normalization script
        working-directory: pr_code
        run: python ../main_code/Data/localization/normalize_loc_file.py

      - name: Commit and push changes
        working-directory: pr_code
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "chore: auto-normalize localization files"
          git push
