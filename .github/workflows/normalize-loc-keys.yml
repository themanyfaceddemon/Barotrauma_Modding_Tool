name: Normalize .loc files

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-on-master:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run python
        run: python Data/localization/normalize_loc_file.py

      - name: Commit and push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "chore: normalize .loc files"
          git push
